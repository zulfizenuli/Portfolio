<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA Rent A Car | Premium Cars Skopje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ELITE CAR RENTAL 2026 - AA Rent A Car Skopje */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --accent: #0ea5e9;
      --dark: #0f172a;
      --light: #f8fafc;
      --glass: rgba(255,255,255,0.1);
      --shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      --shadow-hover: 0 35px 60px -12px rgba(0,0,0,0.3);
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.6;
      color: var(--dark);
      overflow-x: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    header {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }
    
    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    h1 {
      color: var(--dark);
      font-weight: 800;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    main {
      padding-top: 100px;
      padding-bottom: 4rem;
    }
    
    .hero {
      text-align: center;
      padding: 6rem 5%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }
    
    .hero h2 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, white 0%, rgba(255,255,255,0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }
    
    .hero p {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      max-width: 700px;
      margin: 0 auto 4rem;
      color: rgba(255,255,255,0.95);
      font-weight: 400;
    }
    
    .cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      justify-items: center;
      margin-bottom: 4rem;
    }
    
    .car-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      min-width: 300px;
      max-width: 380px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    
    .car-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }
    
    .car-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: var(--shadow-hover);
      border-color: rgba(255,255,255,0.4);
    }
    
    .car-card:hover::before {
      transform: scaleX(1);
    }
    
    .car-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
    }
    
    .car-card h3 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: white;
    }
    
    .car-price {
      font-size: 2.25rem;
      font-weight: 800;
      color: #10b981;
      margin-bottom: 1rem;
    }
    
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.125rem;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(30,64,175,0.4);
      border: none;
      cursor: pointer;
    }
    
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(30,64,175,0.5);
      color: white;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin: 4rem auto;
      max-width: 1000px;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: rgba(255,255,255,0.9);
      font-size: 1.1rem;
    }
    
    .feature-icon {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: white;
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate {
      animation: fadeInUp 0.8s ease forwards;
    }
    
    /* Mobile */
    @media (max-width: 768px) {
      .hero { padding: 4rem 5%; }
      nav { padding: 1rem; }
      .cars-grid { grid-template-columns: 1fr; }
    }
    
    /* Scroll effects */
    .hero h2, .cars-grid, .features { opacity: 0; transform: translateY(30px); transition: all 0.8s ease; }
    .hero h2.visible, .cars-grid.visible, .features.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <header>
    <nav>
      <h1>AA RENT A CAR</h1>
    </nav>
  </header>
  
  <main>
    <section class="hero">
      <h2>Rent Premium Cars in Skopje</h2>
      <p>Fast, reliable cars for airport pickup, city trips or business. Clean vehicles, full insurance, 24/7 support.</p>
      
      <div class="cars-grid">
        <div class="car-card animate" style="animation-delay: 0.2s">
          <i class="fas fa-car-side car-icon"></i>
          <h3>Audi A4</h3>
          <div class="car-price">35€/day</div>
          <a href="tel:+38976225747" class="cta-button">
            <i class="fas fa-phone"></i> Book Now
          </a>
        </div>
        
        <div class="car-card animate" style="animation-delay: 0.4s">
          <i class="fas fa-suv-car-side car-icon"></i>
          <h3>BMW X3</h3>
          <div class="car-price">50€/day</div>
          <a href="tel:+38976225747" class="cta-button">
            <i class="fas fa-phone"></i> Book Now
          </a>
        </div>
      </div>
      
      <div class="features animate" style="animation-delay: 0.6s">
        <div class="feature">
          <div class="feature-icon"><i class="fas fa-plane"></i></div>
          <span>Airport Transfer</span>
        </div>
        <div class="feature">
          <div class="feature-icon"><i class="fas fa-shield-alt"></i></div>
          <span>Full Insurance</span>
        </div>
        <div class="feature">
          <div class="feature-icon"><i class="fas fa-clock"></i></div>
          <span>24/7 Available</span>
        </div>
        <div class="feature">
          <div class="feature-icon"><i class="fas fa-car-crash"></i></div>
          <span>New Vehicles</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Elite scroll animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.hero h2, .cars-grid, .features').forEach(el => {
      observer.observe(el);
    });

    // Smooth scroll & header effects
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 100) {
        header.style.background = 'rgba(255,255,255,0.98)';
        header.style.boxShadow = '0 10px 30px rgba(0,0,0,0.15)';
      } else {
        header.style.background = 'rgba(255,255,255,0.95)';
        header.style.boxShadow = '0 25px 50px -12px rgba(0,0,0,0.25)';
      }
    });

    // Phone click animation
    document.querySelectorAll('.cta-button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = 'tel:+38976225747';
      });
    });
  </script>
</body>
</html>
